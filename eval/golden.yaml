suite_name: opencode-golden
version: 1.0.0
description: >
  Golden evaluation suite for the opencode framework pipeline. Fifty tasks
  cover flutter features, flutter bugfixes, nextjs features, python scripts,
  supabase migrations, publishing releases, marketing campaigns, memory
  consolidation, and config updates. Runner: eval/runner.py. Scoreboard:
  eval/scoreboard.py. Zero banned dashes. ASCII hyphen only.

