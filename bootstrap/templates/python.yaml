# Python 3.13 stack template for opencode bootstrap.
# Consumed by bootstrap/bootstrap at project creation time.
# Banned characters (U+2014, U+2013, U+2012, U+2015) must not appear anywhere.

stack: python
version: "3.13.x"
package_manager: "uv"
uv_version: "0.4.x"
description: "Python 3.13 library or service, uv for dependency management, ruff plus pyright for checks."

# Runtime dependencies. Users extend as needed.
dependencies:
  httpx: "^0.27.0"
  pydantic: "^2.9.0"
  "pydantic-settings": "^2.5.0"
  anthropic: "^0.39.0"
  "python-dotenv": "^1.0.1"
  typer: "^0.12.5"
  rich: "^13.9.0"
  structlog: "^24.4.0"
  tenacity: "^9.0.0"

# Development dependencies.
dev_dependencies:
  pytest: "^8.0.0"
  "pytest-cov": "^5.0.0"
  "pytest-asyncio": "^0.24.0"
  "pytest-mock": "^3.14.0"
  "pytest-xdist": "^3.6.1"
  ruff: "^0.6.0"
  pyright: "^1.1.0"
  mypy: "^1.11.0"
  "pre-commit": "^3.8.0"
  hypothesis: "^6.112.0"

# Files to copy from the bootstrap template bundle into the new project.
files_to_copy:
  - src: "pyproject.toml.template"
    dst: "pyproject.toml"
  - src: "ruff.toml.template"
    dst: "ruff.toml"
  - src: "pyrightconfig.json.template"
    dst: "pyrightconfig.json"
  - src: "main.py.template"
    dst: "src/main.py"
  - src: "__init__.py.template"
    dst: "src/__init__.py"
  - src: "test_smoke.py.template"
    dst: "tests/test_smoke.py"
  - src: "conftest.py.template"
    dst: "tests/conftest.py"
  - src: "pre_commit.yaml.template"
    dst: ".pre-commit-config.yaml"
  - src: "github_workflow.yaml.template"
    dst: ".github/workflows/ci.yaml"

# Commands executed after scaffold lands.
post_init_commands:
  - "uv sync"
  - "uv run ruff check ."
  - "uv run ruff format --check ."
  - "uv run pyright"
  - "uv run pytest -q"

# Secrets registered as Keychain placeholders.
required_secrets:
  - ANTHROPIC_API_KEY
  - OPENAI_API_KEY
  - GITHUB_TOKEN
  - SENTRY_DSN

# Non-secret environment variables.
env_vars:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "latest"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# Build and packaging.
build:
  build_backend: "hatchling.build"
  src_layout: true
  include_tests: false
  wheel_target: "py3-none-any"

# Testing configuration.
testing:
  coverage_target: 85
  framework: "pytest"
  async_mode: "auto"
  parallel: true
  markers:
    - "unit"
    - "integration"
    - "slow"
  test_types:
    - "unit"
    - "integration"
    - "property"

# Directory layout created in the new project.
directories:
  - "src"
  - "tests"
  - "tests/unit"
  - "tests/integration"
  - "docs"
  - "scripts"

# Linting and formatting.
lints:
  ruff_line_length: 100
  ruff_target_version: "py313"
  ruff_rules_enabled:
    - "E"
    - "F"
    - "I"
    - "UP"
    - "B"
    - "SIM"
    - "N"
    - "D"
    - "S"
    - "ANN"
  pyright_mode: "strict"
  mypy_enabled: true
  pre_commit_enabled: true

# Deployment.
deployment:
  target: "pypi_or_docker"
  docker_base: "python:3.13-slim"
  enable_uv_cache: true
